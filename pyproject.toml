[project]
name = "a2a-connect"
version = "0.1.0"
description = "Connect a local Codex session to Clarity's A2A hub: receive pushed messages, wake Codex, send the reply."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
a2a-connect = "a2a_connect.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2a_connect"]
